<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Évènements de l'association</title>
<style>
  :root{
    --bg:#f8f7f4;--surface:#fff;--surface-2:#f1efe8;--ink:#2c2c2a;--ink-soft:#5f5e5a;--ink-faint:#8f8d85;--line:#d3d1c7;
    --accent:#378ade;--accent-deep:#27639f;--accent-ink:#fff;--accent-soft:#e6f1fb;--accent-soft-ink:#183e63;
    --success:#1d9e75;--success-soft:#e1f5ee;--success-soft-ink:#085041;
    --warm:#ba7517;--warm-soft:#faeeda;--warm-soft-ink:#7a5210;
    --danger:#a32d2d;--danger-soft:#fcebeb;
    --radius:10px;--radius-sm:6px;--shadow-sm:0 1px 4px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
  h1,h2,h3{font-family:Georgia,serif;font-weight:600;margin:0}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [hidden]{display:none !important}
  .shell{max-width:1200px;margin:0 auto;padding:0 16px 72px}
  .hero-wrap{background:var(--accent-deep);color:#fff}
  .hero-inner{max-width:1200px;margin:0 auto;padding:22px 16px 26px}
  .eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700}
  .title{font-size:clamp(1.5rem,3.4vw,2rem);margin-top:6px;color:#fff}
  .subtitle{color:rgba(255,255,255,.85);max-width:60ch;margin-top:8px;font-size:.92rem}
  .status-line{margin-top:14px;font-size:.85rem;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:8px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--warm);flex:none}
  .status-dot.ok{background:var(--success)}
  .admin-row{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .admin-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .admin-form input{background:rgba(255,255,255,.95);border:1px solid transparent;border-radius:var(--radius-sm);padding:7px 10px;font-size:.85rem;color:var(--ink)}
  .admin-pill{font-size:.78rem;font-weight:700;color:var(--warm-soft-ink);background:var(--warm-soft);border-radius:999px;padding:4px 10px}
  .link-btn{background:none;border:none;color:var(--accent-deep);font-weight:600;font-size:.85rem;padding:0;text-decoration:underline}
  .admin-row .link-btn{color:#fff}
  .admin-form .btn{color:var(--ink);background:#fff;border-color:transparent}
  .admin-form .btn-ghost{background:none;color:#fff}
  .error-text{color:var(--danger);font-size:.82rem}
  .admin-row .error-text{color:#ffd7ce}
  .ok-text{color:var(--success-soft-ink);font-size:.85rem}
  .admin-row .ok-text{color:#dcffe6}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:20px}
  .stat{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:9px 11px;box-shadow:var(--shadow-sm)}
  .stat-alerte{background:var(--warm-soft);border-left-color:var(--warm)}
  .stat-alerte .stat-value{color:#8a4b0a}
  .stat-value{font-family:Georgia,serif;font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
  .stat-label{color:var(--ink-soft);font-size:.7rem;margin-top:1px;line-height:1.25}
  .tabs{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{border-radius:var(--radius-sm);border:1px solid transparent;padding:10px 18px;font-weight:700;font-size:1rem;background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
  .tab[data-tab="parametres"],.tab[data-tab="donnees"]{background:var(--warm)}
  .tab[aria-selected="true"]{box-shadow:inset 0 0 0 3px rgba(0,0,0,.3)}
  .panel{padding-top:20px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .toolbar h2{font-size:1.25rem}
  .toolbar-meta{color:var(--ink-soft);font-size:.86rem}
  .btn{border-radius:var(--radius-sm);padding:8px 14px;border:1px solid #000;background:var(--surface);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
  .btn:disabled{opacity:.5;cursor:not-allowed;border-color:transparent}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-ghost{background:none;border-color:transparent;color:var(--ink-soft)}
  .btn-sm{padding:5px 11px;font-size:.8rem}
  .btn-danger-ghost{background:none;border:1px solid #000;border-radius:var(--radius-sm);color:var(--danger);padding:5px 10px;font-size:.8rem}
  .form{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px}
  .field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:.82rem;font-weight:600;color:var(--ink-soft)}
  .field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 10px}
  .form-actions{display:flex;gap:10px;margin-top:6px;align-items:center;flex-wrap:wrap}
  .form-hint{color:var(--ink-faint);font-size:.8rem}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px}
  .card-title{font-family:Georgia,serif;font-size:1.1rem;font-weight:600}
  .meta{color:var(--ink-soft);font-size:.86rem}
  .head{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:.76rem;font-weight:700;white-space:nowrap;background:var(--accent-soft);color:var(--accent-soft-ink)}
  .badge.low{background:var(--danger-soft);color:var(--danger)}
  .badge.warm{background:var(--warm-soft);color:var(--warm-soft-ink)}
  .badge.ok{background:var(--success-soft);color:var(--success-soft-ink)}
  .empty-state{color:var(--ink-faint);padding:30px 10px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
  .alert{background:var(--warm-soft);color:var(--warm-soft-ink);border:1px solid var(--warm);border-radius:8px;padding:8px 12px;font-size:.88rem;font-weight:600;margin-bottom:12px}
  .table-scroll{overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line)}
  .tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}
  .tbl th{background:var(--surface-2);color:var(--ink-soft);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
  .tbl tbody tr:nth-child(even) td{background:var(--accent-soft)}
  .tbl tr.clic{cursor:pointer}
  .tbl tr.clic:hover td{background:var(--surface-2) !important}
  .num{text-align:right !important;font-variant-numeric:tabular-nums}
  .th-tri{background:none;border:none;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:inherit}
  .th-tri.active{color:var(--accent-deep);font-weight:700}
  .list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;flex-wrap:wrap}
  .modal-backdrop{position:fixed;inset:0;background:rgba(44,44,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100}
  .modal-box{background:var(--surface);border-radius:var(--radius);box-shadow:0 16px 48px rgba(0,0,0,.28);max-width:820px;width:100%;margin:auto;overflow:hidden}
  .modal-head{display:flex;justify-content:space-between;align-items:center;background:var(--accent-deep);color:#fff;padding:16px 24px}
  .modal-head h3{color:#fff;font-size:1.25rem}
  .modal-close{background:rgba(255,255,255,.16);border:1px solid #000;font-size:1rem;color:#fff;padding:6px 11px;border-radius:999px}
  .modal-body{padding:20px 24px 24px}
  .section-title{font-size:.78rem;font-weight:700;letter-spacing:.03em;color:var(--accent-deep);text-transform:uppercase;margin:16px 0 8px;border-top:1px solid var(--line);padding-top:14px}
  #print-root{display:none}
  @media print{
    body > *:not(#print-root){display:none !important}
    #print-root{display:block;padding:10mm;color:#000;background:#fff}
    #print-root table{width:100%;border-collapse:collapse;margin:6px 0 14px}
    #print-root th,#print-root td{border:1px solid #999;padding:4px 7px;font-size:11pt;text-align:left}
    #print-root .num{text-align:right}
    #print-root h1{font-size:18pt;margin:0 0 4px}#print-root h2{font-size:13pt;margin:14px 0 4px}
  }
  .acc-ligne{margin:6px 0}
  .acc-btns{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:8px}
  .btn-acc{display:inline-flex;align-items:center;border:0;border-radius:999px;padding:9px 16px;font-size:.9rem;font-weight:700;cursor:pointer}
  .btn-acc-plus{background:var(--success-soft);color:var(--success-soft-ink);box-shadow:inset 0 0 0 1.5px var(--success)}
  .btn-acc-moins{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
  .btn-acc:disabled{opacity:.4;cursor:not-allowed}
  .solde-pos{color:var(--danger);font-weight:700}.solde-neg{color:var(--success-soft-ink);font-weight:700}
  .inscrit-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
  .inscrit-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .check{display:flex;align-items:center;gap:5px;font-size:.8rem;color:var(--ink-soft)}
  .setup{max-width:720px;margin:40px auto;background:var(--warm-soft);border:1px solid var(--warm);border-radius:var(--radius);padding:20px;color:var(--warm-soft-ink)}
  .footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.8rem}
</style>
</head>
<body>

<div class="hero-wrap">
  <div class="hero-inner">
    <div class="eyebrow" id="version-appli"></div>
    <h1 class="title">Les ami.es des Rancy</h1>
    <p class="subtitle">Consultez les évènements proposés aux adhérents et inscrivez-vous (et, quand l'évènement le permet, vos accompagnants). Les places restantes sont mises à jour en direct.</p>
    <div class="status-line"><span class="status-dot" id="status-dot"></span><span id="status-text">Connexion à la base de données…</span></div>
    <div class="admin-row" id="admin-row"></div>
  </div>
</div>

<div class="shell">
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs-bar" role="tablist" hidden>
    <button class="tab" role="tab" data-tab="evenements" aria-selected="true">Évènements</button>
    <button class="tab" role="tab" data-tab="adherents" aria-selected="false">Adhérents</button>
    <button class="tab" role="tab" data-tab="recap" aria-selected="false" id="tab-recap" hidden>Récapitulatif</button>
    <button class="tab" role="tab" data-tab="historique" aria-selected="false">Historique</button>
    <button class="tab" role="tab" data-tab="parametres" aria-selected="false" id="tab-parametres" hidden>Paramètres</button>
    <button class="tab" role="tab" data-tab="donnees" aria-selected="false" id="tab-donnees" hidden>Données</button>
  </div>
  <section class="panel" id="panel-evenements"></section>
  <section class="panel" id="panel-adherents" hidden></section>
  <section class="panel" id="panel-recap" hidden></section>
  <section class="panel" id="panel-historique" hidden></section>
  <section class="panel" id="panel-parametres" hidden></section>
  <section class="panel" id="panel-donnees" hidden></section>
  <div class="footer" id="footer">Gestion des évènements de l'association.</div>
</div>

<div id="modal-root"></div>
<div id="compte-root"></div>
<div id="print-root"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getFirestore, collection, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, doc, getDoc, serverTimestamp, writeBatch, query, where, Timestamp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  // ====== À REMPLIR : configuration de TON nouveau projet Firebase (voir LISEZ-MOI.md) ======
  const NOM_ASSOCIATION = "Les ami.es des Rancy";
  const VERSION_APPLI = "1.0";
  const firebaseConfig = {
    apiKey: "AIzaSyAClU986rgOr7uWWzKpQXl8NYZF6odxzoo",
    authDomain: "evenements-adherents.firebaseapp.com",
    projectId: "evenements-adherents",
    storageBucket: "evenements-adherents.firebasestorage.app",
    messagingSenderId: "355507826974",
    appId: "1:355507826974:web:ad713839a2a13e91fd590f"
  };
  // =========================================================================================

  document.getElementById("version-appli").textContent = "Version " + VERSION_APPLI;
  document.title = "Évènements — " + NOM_ASSOCIATION;
  document.getElementById("footer").textContent = NOM_ASSOCIATION + " — gestion des évènements.";

  if(String(firebaseConfig.apiKey).indexOf("REMPLACER") === 0){
    document.getElementById("status-text").textContent = "Configuration Firebase manquante";
    document.getElementById("panel-evenements").innerHTML =
      '<div class="setup"><h2>Configuration à faire</h2><p>Ce fichier doit être relié à un projet Firebase : ouvre-le dans un éditeur de texte, remplace les valeurs « REMPLACER » dans <code>firebaseConfig</code> (et le nom de l\'association), puis publie les règles du fichier <code>firestore.rules</code>. Le pas-à-pas est dans <code>LISEZ-MOI.md</code>.</p></div>';
    throw new Error("Firebase non configuré");
  }

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  // Seconde instance : sert uniquement à créer un compte gestionnaire sans déconnecter le Directeur.
  const secondaryApp = initializeApp(firebaseConfig, "secondary");
  const secondaryAuth = getAuth(secondaryApp);

  var CATEGORIES_DEFAUT = ["Sortie","Repas","Atelier","Assemblée","Spectacle"];
  var STATUTS_BASE = ["Ouvert","À vérifier","Clos","Clôturé par défaut","Annulé"]; // protégés : l'appli en dépend

  var state = { adherents: [], evenements: [], inscriptions: [], gestionnaires: [], historique: [], mouvements: [], frais: [], fiches: [], candidatures: [], categories: CATEGORIES_DEFAUT.slice(), statutsPerso: [] };
  var role = "public", moiNom = "", moiUid = null, moiAdherentId = null;
  var authReady = false;
  var currentTab = "evenements";
  var loginFormOpen = false, loginError = "", loginInfo = "";
  var identiteFormOpen = false, identiteError = "";
  var importStatus = "", importError = false, reinitialisationStatus = "", reinitialisationError = false;
  var modalEvenementId = null, modalOuverte = false, modalErreur = "", modalCreeId = null, modalStatutBrouillon = null, modalJustifBrouillon = null, brouillon = { budget: null, frais: [], rappels: [] };
  var adherentFormOpen = false, adherentErreur = "";
  var adherentsRecherche = "", adherentsTri = "nom";
  var evenementsRecherche = "", evenementsFiltreStatut = "", evenementsAvenirSeulement = true, evenementsMiens = false, evenementsFiltreTuile = "", adherentsFiltreActifs = false, adherentsFiltreCandidatures = false;
  var historiqueRecherche = "";
  var equipeFormOpen = false, equipeErreur = "";
  var candidatureFormOpen = false, candidatureError = "", candidatureEnvoyee = false, mailAEnvoyer = null;
  var fraisEnEdition = null, fraisErreur = "", recapAvenirSeulement = true, compteAdherentId = null, compteEvenementId = null, compteErreur = "", backfillEnCours = false;
  var unsubCandidatures = null, unsubFrais = null, unsubFiches = null, unsubMoi = null, unsubMoiAdherent = null, unsubMoiMouv = null, unsubMouvements = null, unsubAdherents = null, unsubGestionnaires = null, unsubHistorique = null;
  var unsubEvenements = null, unsubInscriptions = null, unsubParametres = null;

  // Mode simple (par défaut) ou « Gestion avancée » : réglage propre à chaque évènement (case cochée à sa création ou modification).
  // Quand il est absent ou décoché, les finances de l'évènement (frais, budget, recettes, bilan) sont masquées ; les données déjà saisies sont conservées.
  function modeAvance(ev){ return role !== "public" && !!ev && ev.gestionAvancee === true; }
  function badgeAvance(ev){ return ev && ev.gestionAvancee === true ? ' <span class="badge warm">Gestion avancée</span>' : ''; }
  function ilYAAvance(){ return state.evenements.some(function(e){ return e.gestionAvancee === true; }); }

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function fmtDate(iso){
    try{ var s = new Date(iso+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); return s.charAt(0).toUpperCase()+s.slice(1); }catch(e){ return iso; }
  }
  function fmtDateCourt(iso){ try{ return new Date(iso+"T00:00:00").toLocaleDateString("fr-FR"); }catch(e){ return iso; } }
  function fmtEuro(n){ return (Math.round((n||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
  function evenementById(id){ return state.evenements.find(function(e){ return e.id === id; }); }
  function adherentById(id){ return state.adherents.find(function(a){ return a.id === id; }); }
  function nomAdherent(a){ return a ? (a.prenom+" "+a.nom) : "(adhérent supprimé)"; }

  // L'identifiant d'un adhérent est l'empreinte SHA-256 de son email : les inscriptions
  // (lisibles publiquement pour compter les places) ne révèlent donc aucune adresse.
  async function idAdherent(email){
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(email).trim().toLowerCase()));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  }

  function inscriptionsDe(evId){ return state.inscriptions.filter(function(i){ return i.evenementId === evId; }); }
  function personnes(i){ return 1 + (i.nbAccompagnants||0); }
  // Accompagnants : autorisés évènement par évènement (accompagnantsMax, 0 = non autorisés), chacun est enregistré par son nom.
  function accMax(ev){ var n = parseInt(ev && ev.accompagnantsMax, 10); return n > 0 ? Math.min(10, n) : 0; }
  function nomsAcc(i){ return Array.isArray(i.accompagnants) ? i.accompagnants : []; }
  function parseNoms(txt){ return String(txt||"").split(/\n/).map(function(x){ return x.trim().slice(0,80); }).filter(Boolean); }
  function texteAcc(i){
    var n = nomsAcc(i), sans = (i.nbAccompagnants||0) - n.length;
    return n.map(esc).join(", ") + (sans > 0 ? (n.length ? " + " : "") + sans + " sans nom" : "");
  }
  function placesPrises(ev){
    return inscriptionsDe(ev.id).filter(function(i){ return i.statut === "inscrit"; }).reduce(function(s,i){ return s + personnes(i); }, 0);
  }
  // Places : champ vide (enregistré 0) = illimité, par exemple pour une visite de musée.
  function illimite(ev){ return !(ev.placesTotal > 0); }
  function placesRestantes(ev){ return illimite(ev) ? Infinity : ev.placesTotal - placesPrises(ev); }
  function txtPlaces(ev){ return illimite(ev) ? placesPrises(ev)+' inscrit(s), places illimitées' : placesPrises(ev)+' / '+ev.placesTotal+' places'; }
  function enAttente(ev){ return inscriptionsDe(ev.id).filter(function(i){ return i.statut === "attente"; }); }
  // Statuts : 4 statuts de base protégés + statuts ajoutés par le Directeur (Paramètres).
  function listeStatuts(){ return STATUTS_BASE.concat(state.statutsPerso.filter(function(x){ return STATUTS_BASE.indexOf(x) < 0; })); }
  function aujourdhuiIso(){ var d = new Date(), p2 = function(n){ return String(n).padStart(2,"0"); }; return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
  // « À vérifier » : le lendemain de la date, un évènement resté « Ouvert » est AFFICHÉ « À vérifier » tout de suite, puis ENREGISTRÉ comme tel
  // dès qu'une session de son organisateur ou du Directeur est ouverte (pas de serveur qui tourne seul : voir persisterAVerifier).
  function aVerifierAuto(ev){ return !!ev && ev.statut === "Ouvert" && !!ev.date && ev.date < aujourdhuiIso(); }
  function statutAffiche(ev){ return aVerifierAuto(ev) ? "À vérifier" : ev.statut; }
  function estAVerifier(ev){ return statutAffiche(ev) === "À vérifier"; }
  // Points à contrôler avant de clôturer un évènement dont la date est passée (bloquants).
  function controleCloture(ev){
    var pb = [], ins = inscriptionsDe(ev.id), inscrits = ins.filter(function(i){ return i.statut === "inscrit"; });
    var dem = ins.filter(function(i){ return i.demandeAnnulation; }).length;
    if(dem) pb.push(dem+" demande(s) d'annulation à traiter");
    if((ev.tarif||0) > 0){
      var imp = 0, reste = 0, remb = 0;
      inscrits.forEach(function(i){ var ep = etatPaiement(ev, i); if(ep.reste > 0){ imp++; reste += ep.reste; } else if(ep.reste < 0) remb++; });
      if(imp) pb.push(imp+" inscrit(s) n'ont pas tout réglé (reste "+fmtEuro(reste)+")");
      if(remb) pb.push(remb+" remboursement(s) à effectuer");
    }
    if(ev.gestionAvancee === true){
      var fr = state.frais.filter(function(f){ return f.evenementId === ev.id && f.statut !== "paye"; });
      if(fr.length) pb.push(fr.length+" frais ou recette(s) pas encore payés/reçus ("+fmtEuro(fr.reduce(function(sm,f){ return sm + (f.montant||0); }, 0))+")");
      var nf = ((ficheDe(ev.id)||{}).rappels || []).filter(function(r){ return !r.fait; }).length;
      if(nf) pb.push(nf+" rappel(s) non fait(s)");
    }
    return pb;
  }
  function evenementPasse(ev){
    if(!ev || !ev.date) return false;
    var t = new Date(ev.date+"T"+(ev.fin||"23:59")+":00").getTime();
    return !isNaN(t) && t < Date.now();
  }
  function montantDu(ev, i){ return (ev.tarif||0) * personnes(i); }
  function numEv(ev){ return ev && ev.numero ? "N° "+ev.numero : ""; }

  // ---------- compte de l'adhérent (registre des mouvements) ----------
  // Montant > 0 = somme due par l'adhérent ; montant < 0 = somme reçue (ou avoir). Le solde est la somme.
  var TYPES_REGLEMENT = ["paiement","annulation_paiement","remboursement"];
  var LIBELLES_MVT = { inscription:"Inscription", attente:"Inscription en liste d'attente", promotion:"Passage de l'attente à inscrit", ajout:"Ajout d'accompagnant",
    retrait:"Retrait d'accompagnant", annulation:"Annulation de l'inscription", reprise:"Reprise d'une inscription antérieure",
    paiement:"Règlement reçu", annulation_paiement:"Règlement annulé (correction)", remboursement:"Remboursement effectué" };
  function mouvementsDe(adhId, evId){ return state.mouvements.filter(function(m){ return m.adherentId === adhId && m.evenementId === evId; }); }
  function msDate(m){ try{ return m.date.toMillis(); }catch(e){ return Number.MAX_SAFE_INTEGER; } }
  // État financier d'une inscription, calculé à partir du registre (ou, à défaut, de l'ancien drapeau « Payé »).
  function etatPaiement(ev, i){
    var ms = mouvementsDe(i.adherentId, ev.id);
    if(!ms.length){
      var du0 = i.statut === "inscrit" ? montantDu(ev, i) : 0;
      return { du: du0, regle: i.paye ? du0 : 0, reste: i.paye ? 0 : du0 };
    }
    var du = 0, regle = 0;
    ms.forEach(function(m){ if(TYPES_REGLEMENT.indexOf(m.type) >= 0) regle -= (m.montant||0); else du += (m.montant||0); });
    return { du: du, regle: regle, reste: Math.round((du - regle)*100)/100 };
  }
  function estPaye(ev, i){ var e = etatPaiement(ev, i); return e.du > 0 && e.reste <= 0; }
  function soldeAdherent(adhId){ return Math.round(state.mouvements.filter(function(m){ return m.adherentId === adhId; }).reduce(function(s,m){ return s + (m.montant||0); }, 0)*100)/100; }
  // Ajoute un mouvement à un lot d'écritures (écrit en même temps que la modification qui le provoque).
  function ajouterMouvement(batch, ev, adhId, type, pers, montant, origine, libelleSup){
    var adh = adherentById(adhId);
    batch.set(doc(collection(db,"mouvements")), { adherentId: adhId, evenementId: ev.id, evenementNumero: ev.numero || 0, evenementTitre: ev.titre,
      type: type, libelle: (LIBELLES_MVT[type]||type) + (libelleSup ? " — "+libelleSup : ""), personnes: pers, montant: Math.round(montant*100)/100,
      parNom: origine === "public" ? nomAdherent(adh) : moiNom, parRole: origine === "public" ? "public" : role, date: serverTimestamp() });
  }
  // Une inscription créée avant l'existence du registre reçoit d'abord une ligne de « reprise » à son montant actuel.
  function avecReprise(batch, ev, i, origine){
    if(i.statut === "inscrit" && (ev.tarif||0) > 0 && !mouvementsDe(i.adherentId, ev.id).length)
    {
      ajouterMouvement(batch, ev, i.adherentId, "reprise", personnes(i), montantDu(ev,i), origine);
      if(i.paye) ajouterMouvement(batch, ev, i.adherentId, "paiement", 0, -montantDu(ev,i), origine, "reprise");
    }
  }
  // Organisateur d'une fiche = la personne qui l'a créée. Seul lui (et le Directeur, en secours) peut la traiter.
  function organisateurDe(ev){ return (ev && (ev.organisateurNom || ev.creePar)) || ""; }
  function peutGerer(ev){
    if(!ev) return false;
    if(role === "directeur") return true;
    return role === "gestionnaire" && !!moiUid && ev.organisateurUid === moiUid;
  }

  function logHistorique(action, cible, nomDeclare, roleDeclare){
    addDoc(collection(db,"historique"), { action: action, cible: cible, parNom: nomDeclare || moiNom, parRole: roleDeclare || role, date: serverTimestamp() })
      .catch(function(e){ console.error("historique:", e); });
  }
  function reportError(err){ console.error(err); alert("Une erreur est survenue : " + (err && err.message ? err.message : err)); }

  // ---------- finances d'un évènement ----------
  var FRAIS_CATEGORIES = ["Salle / location","Traiteur / repas","Transport","Animation / intervenant","Assurance","Matériel","Communication","Divers"];
  function fraisDe(evId){ return state.frais.filter(function(f){ return f.evenementId === evId; }).sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); }); }
  function estRecette(f){ return f.sens === "recette"; }
  function ficheDe(evId){ return state.fiches.find(function(f){ return f.id === evId; }) || null; }
  function lienSur(u){ return /^https?:\/\//i.test(u||"") ? u : ""; }
  // Bilan : « engagé » = total des dépenses saisies ; « encaissé » = versements nets reçus des inscrits ;
  // « autres recettes » = subventions, buvette, sponsor… saisies à la main (reçues ou attendues).
  function bilanEvenement(ev){
    var tous = fraisDe(ev.id), fr = tous.filter(function(f){ return !estRecette(f); }), rec = tous.filter(estRecette);
    var engage = 0, fraisPayes = 0, recRecues = 0, recAttendues = 0;
    fr.forEach(function(f){ engage += (f.montant||0); if(f.statut === "paye") fraisPayes += (f.montant||0); });
    rec.forEach(function(f){ if(f.statut === "paye") recRecues += (f.montant||0); else recAttendues += (f.montant||0); });
    var du = 0, regle = 0, pers = 0;
    inscriptionsDe(ev.id).filter(function(i){ return i.statut === "inscrit"; }).forEach(function(i){
      var ep = etatPaiement(ev, i); du += ep.du; regle += ep.regle; pers += personnes(i);
    });
    function r2(x){ return Math.round(x*100)/100; }
    var fiche = ficheDe(ev.id), budget = fiche && typeof fiche.budget === "number" ? fiche.budget : null;
    return { frais: fr, recettes: rec, engage: r2(engage), fraisPayes: r2(fraisPayes), fraisAPayer: r2(engage - fraisPayes),
      recettesRecues: r2(recRecues), recettesAttendues: r2(recAttendues), budget: budget, ecartBudget: budget === null ? null : r2(budget - engage),
      du: r2(du), regle: r2(regle), resteEncaisser: r2(Math.max(0, du - regle)),
      resultat: r2(regle + recRecues - engage), previsionnel: r2(du + recRecues + recAttendues - engage), personnes: pers,
      coutParPersonne: pers ? r2(engage / pers) : 0, rappels: (fiche && fiche.rappels) || [] };
  }
  var RAPPELS_TYPES = ["Assurance à vérifier", "Autorisation / réservation du lieu", "Matériel à prévoir", "Prévenir les adhérents (rappel de date et lieu)", "Liste des inscrits imprimée pour le jour J", "Encaisser les soldes restants", "Régler les fournisseurs"];

      + '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-login" style="color:#fff">Annuler</button>'
      + '<button type="button" class="link-btn" data-action="mdp-oublie">Code oublié ?</button>'

  // ---------- tuiles ----------
  function renderStats(){
    var tuiles = [];
    var aVenirOuverts = state.evenements.filter(function(e){ return e.statut === "Ouvert" && !evenementPasse(e); });
    var placesLibres = aVenirOuverts.reduce(function(s,e){ return s + (illimite(e) ? 0 : Math.max(0, placesRestantes(e))); }, 0);
    function stat(v,l,alerte,action){ return '<div class="stat'+(alerte?" stat-alerte":"")+'"'+(action ? ' data-action="'+action+'" role="button" tabindex="0" style="cursor:pointer"' : '')+'><div class="stat-value">'+v+'</div><div class="stat-label">'+l+'</div></div>'; }
    if(role === "public"){
      tuiles.push(stat(aVenirOuverts.length,"Évènements proposés",false,"tuile-avenir"), stat(placesLibres,"Places disponibles",false,"tuile-places"));
    } else {
      var demandes = state.inscriptions.filter(function(i){ return i.demandeAnnulation && peutGerer(evenementById(i.evenementId)); }).length;
      var impayes = 0;
      state.inscriptions.forEach(function(i){
        var ev = evenementById(i.evenementId);
        if(ev && peutGerer(ev) && i.statut === "inscrit" && (ev.tarif||0) > 0 && etatPaiement(ev,i).reste > 0) impayes++;
      });
      var nbAVerifier = state.evenements.filter(function(e){ return estAVerifier(e) && peutGerer(e); }).length;
      if(nbAVerifier) tuiles.push(stat(nbAVerifier, "Évènement"+(nbAVerifier>1?"s":"")+" à vérifier avant clôture (cliquer pour filtrer)", true, "filtre-a-verifier"));
      if(role === "directeur"){
        var nbCd = state.evenements.filter(function(e){ return e.statut === "Clôturé par défaut"; }).length;
        if(nbCd) tuiles.push(stat(nbCd, "Évènement"+(nbCd>1?"s":"")+" clôturé"+(nbCd>1?"s":"")+" par défaut à examiner (cliquer pour filtrer)", true, "filtre-clotures-defaut"));
      }
      if(state.candidatures.length) tuiles.push(stat(state.candidatures.length, "Candidature"+(state.candidatures.length>1?"s":"")+" à valider (cliquer pour les voir)", true, "tuile-candidatures"));
      if(demandes) tuiles.push(stat(demandes, "Demande"+(demandes>1?"s":"")+" d'annulation (cliquer pour filtrer)", true, "tuile-annulation"));
      if(impayes) tuiles.push(stat(impayes, "Paiement"+(impayes>1?"s":"")+" en attente (cliquer pour filtrer)", true, "tuile-impayes"));
      var inscritsAvenir = 0, attenteAvenir = 0;
      aVenirOuverts.forEach(function(e){ inscritsAvenir += placesPrises(e); attenteAvenir += enAttente(e).reduce(function(s,i){ return s+personnes(i); },0); });
      tuiles.push(stat(aVenirOuverts.length,"Évènements à venir",false,"tuile-avenir"), stat(placesLibres,"Places libres",false,"tuile-places"),
        stat(inscritsAvenir,"Personnes inscrites (à venir)",false,"tuile-inscrits"), stat(attenteAvenir,"Personnes en attente",false,"tuile-attente"),
        stat(state.adherents.filter(function(a){ return a.actif; }).length,"Adhérents actifs",false,"tuile-adherents-actifs"));
    }
    document.getElementById("stats").innerHTML = tuiles.join("");
  }

  // ---------- évènements ----------
  function carteEvenementPublic(ev){
    var restantes = placesRestantes(ev);
    var moi = moiAdherentId ? adherentById(moiAdherentId) : null;
    var monInscription = moiAdherentId ? inscriptionsDe(ev.id).find(function(i){ return i.adherentId === moiAdherentId; }) : null;
    var badge = illimite(ev) ? '<span class="badge">Places illimitées</span>' : restantes <= 0 ? '<span class="badge low">Complet</span>' : '<span class="badge">'+restantes+' place'+(restantes>1?'s':'')+' restante'+(restantes>1?'s':'')+'</span>';
    var action = "";
    if(!moi){
      action = '<div class="meta">Identifiez-vous ci-dessus pour vous inscrire.</div>';
    } else if(monInscription){
      var st = monInscription.statut === "attente" ? '<span class="badge warm">En liste d\'attente</span>' : '<span class="badge ok">✓ Vous êtes inscrit·e ('+personnes(monInscription)+' pers.)</span>';
      var ep = etatPaiement(ev, monInscription);
      var peutModifier = ev.statut === "Ouvert" && !evenementPasse(ev) && !monInscription.demandeAnnulation && authReady;
      var nbAcc = monInscription.nbAccompagnants || 0, maxAcc = accMax(ev), noms = nomsAcc(monInscription);
      var plusOk = peutModifier && maxAcc > 0 && nbAcc < maxAcc && (monInscription.statut === "attente" || restantes >= 1);
      var blocAcc = '';
      if(maxAcc > 0 || nbAcc > 0){
        blocAcc = '<div class="acc-ligne"><span>Accompagnants : <strong>'+nbAcc+'</strong>'+(maxAcc>0 ? ' (maximum '+maxAcc+')' : '')+'</span>'
          + (peutModifier && maxAcc > 0 ? '<div class="acc-btns"><input type="text" id="acc-nom-'+monInscription.id+'" maxlength="80" placeholder="Prénom et nom de la personne" style="max-width:260px">'
            + '<button type="button" class="btn-acc btn-acc-plus" data-action="modifier-acc" data-id="'+monInscription.id+'" data-delta="1" '+(plusOk?'':'disabled')+'>+ Ajouter une personne</button></div>' : '')
          + noms.map(function(n, k){ return '<div class="acc-btns"><span>'+esc(n)+'</span>'
              + (peutModifier ? '<button type="button" class="btn-acc btn-acc-moins" data-action="modifier-acc" data-id="'+monInscription.id+'" data-delta="-1" data-idx="'+k+'">− Retirer une personne</button>' : '')+'</div>'; }).join("")
          + (nbAcc > noms.length ? '<div class="acc-btns"><span>'+(nbAcc-noms.length)+' personne(s) sans nom</span>'
              + (peutModifier ? '<button type="button" class="btn-acc btn-acc-moins" data-action="modifier-acc" data-id="'+monInscription.id+'" data-delta="-1" data-idx="-1">− Retirer une personne</button>' : '')+'</div>' : '')
          + '</div>';
      }
      action = '<div>'+st+'</div>' + blocAcc
        + (peutModifier && maxAcc > 0 && nbAcc < maxAcc && monInscription.statut === "inscrit" && restantes < 1 ? '<div class="meta">Plus de place disponible pour ajouter quelqu\'un.</div>' : '')
        + ((ev.tarif||0)>0 && monInscription.statut==="inscrit" ? '<div class="meta">Montant : '+fmtEuro(ep.du)+' · Réglé : '+fmtEuro(ep.regle)+' · '
            + (ep.reste > 0 ? '<strong>Reste à régler : '+fmtEuro(ep.reste)+'</strong>' : (ep.reste < 0 ? '<strong>À vous rembourser : '+fmtEuro(-ep.reste)+'</strong>' : '<strong>Soldé</strong>'))+'</div>' : '')
        + (monInscription.demandeAnnulation ? '<div class="meta">Votre demande d\'annulation a été transmise.</div>'
          : '<div><button class="btn btn-ghost btn-sm" data-action="demander-annulation" data-id="'+monInscription.id+'">Demander l\'annulation</button></div>');
    } else if(!moi.actif){
      action = '<div class="meta">Votre fiche est inactive : contactez l\'association.</div>';
    } else {
      action = (accMax(ev) > 0
        ? '<div class="field" style="margin:6px 0 0"><label for="acc-'+ev.id+'" style="font-weight:700;color:var(--ink)">Accompagnants (facultatif) : un nom par ligne, maximum '+accMax(ev)+'</label>'
          + '<textarea id="acc-'+ev.id+'" rows="2" placeholder="Prénom Nom"></textarea></div>'
        : '')
        + '<div class="form-actions"><button class="btn btn-primary btn-sm" data-action="inscrire-moi" data-id="'+ev.id+'" '+(authReady?"":"disabled")+'>'+(restantes<=0 ? "Rejoindre la liste d'attente" : "M'inscrire")+'</button></div>';
    }
    return '<div class="card"><div class="head"><span class="badge">'+esc(ev.categorie||"")+'</span>'+badge+'</div>'
      + '<div class="card-title">'+esc(ev.titre)+(ev.numero?' <span class="meta">('+numEv(ev)+')</span>':'')+'</div>'
      + '<div class="meta">'+fmtDate(ev.date)+' · '+esc(ev.debut)+'–'+esc(ev.fin)+'</div>'
      + '<div class="meta">'+esc(ev.lieu)+'</div>'
      + (organisateurDe(ev) ? '<div class="meta">Organisé par <strong>'+esc(organisateurDe(ev))+'</strong></div>' : '')
      + '<div class="meta">'+((ev.tarif||0)>0 ? 'Tarif : '+fmtEuro(ev.tarif)+' par personne' : 'Gratuit')+'</div>'
      + '<div class="meta">'+(accMax(ev)>0 ? 'Accompagnants acceptés : jusqu\'à '+accMax(ev)+' par inscrit' : 'Réservé aux adhérents (pas d\'accompagnants)')+'</div>'
      + (ev.description ? '<div class="meta">'+esc(ev.description)+'</div>' : '')
      + action + '</div>';
  }

  function champ(label, name, type, value, required, extra){
    return '<div class="field"><label for="f-'+name+'">'+label+'</label><input id="f-'+name+'" name="'+name+'" type="'+(type||"text")+'" '
      + (required?"required ":"") + (extra||"") + (value!=null && value!=="" ? 'value="'+esc(value)+'"' : '') + '></div>';
  }

  function recherchevide(){ evenementsRecherche = ""; }
  var LIBELLES_TUILES = { annulation: "avec une demande d'annulation", impayes: "avec des paiements en attente", avenir: "à venir (ouverts)",
    places: "à venir avec des places libres", inscrits: "à venir avec des inscrits", attente: "à venir avec des personnes en attente" };
  function ouvertAvenir(e){ return e.statut === "Ouvert" && !evenementPasse(e); }
  function tuileOk(e){
    switch(evenementsFiltreTuile){
      case "annulation": return peutGerer(e) && inscriptionsDe(e.id).some(function(i){ return i.demandeAnnulation; });
      case "impayes": return peutGerer(e) && (e.tarif||0) > 0 && inscriptionsDe(e.id).some(function(i){ return i.statut === "inscrit" && etatPaiement(e,i).reste > 0; });
      case "avenir": return ouvertAvenir(e);
      case "places": return ouvertAvenir(e) && !illimite(e) && placesRestantes(e) > 0;
      case "inscrits": return ouvertAvenir(e) && placesPrises(e) > 0;
      case "attente": return ouvertAvenir(e) && enAttente(e).length > 0;
    }
    return true;
  }
  function bandeauFiltreTuile(){
    return evenementsFiltreTuile ? '<div class="alert" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">Filtre actif : évènements '+LIBELLES_TUILES[evenementsFiltreTuile]
      +' <button type="button" class="btn btn-ghost btn-sm" data-action="retirer-filtre-tuile">Retirer le filtre</button></div>' : '';
  }
  // Ouvre la messagerie par défaut avec le message prérempli (sans bouton) ; le navigateur peut demander une autorisation la première fois.
  function ouvrirMessagerie(href){
    try { var l = document.createElement("a"); l.href = href; l.style.display = "none"; document.body.appendChild(l); l.click(); document.body.removeChild(l); } catch(err){}
  }
  function renderEvenements(){
    var html;
    if(role === "public"){
      var visibles = state.evenements.filter(function(e){ return e.statut === "Ouvert" && !evenementPasse(e) && tuileOk(e); })
        .sort(function(a,b){ return (a.date+a.debut).localeCompare(b.date+b.debut); });
      html = '<div class="toolbar"><h2>Évènements</h2></div>' + renderIdentite() + bandeauFiltreTuile()
        + (visibles.length ? '<div class="card-grid">'+visibles.map(carteEvenementPublic).join("")+'</div>' : '<div class="empty-state">Aucun évènement proposé pour l\'instant.</div>');
      document.getElementById("panel-evenements").innerHTML = html;
      return;
    }
    var r = evenementsRecherche.trim().toLowerCase();
    var liste = state.evenements.filter(function(e){
      if(evenementsAvenirSeulement && evenementPasse(e) && ["À vérifier","Clôturé par défaut"].indexOf(evenementsFiltreStatut) < 0) return false;
      if(evenementsFiltreStatut && statutAffiche(e) !== evenementsFiltreStatut) return false;
      if(evenementsMiens && !peutGerer(e)) return false;
      if(!tuileOk(e)) return false;
      if(!r) return true;
      return (e.titre||"").toLowerCase().indexOf(r) >= 0 || (e.lieu||"").toLowerCase().indexOf(r) >= 0 || (e.categorie||"").toLowerCase().indexOf(r) >= 0;
    }).sort(function(a,b){ return (a.date+a.debut).localeCompare(b.date+b.debut); });
    var demandes = state.inscriptions.filter(function(i){ return i.demandeAnnulation && peutGerer(evenementById(i.evenementId)); }).length;
    var lignes = liste.map(function(e){
      var att = enAttente(e).length;
      var dem = peutGerer(e) && inscriptionsDe(e.id).some(function(i){ return i.demandeAnnulation; });
      return '<tr class="clic" data-action="edit-evenement" data-id="'+e.id+'">'
        + '<td class="num">'+(e.numero||"—")+'</td><td><strong>'+fmtDateCourt(e.date)+'</strong><div class="meta">'+esc(e.debut)+'–'+esc(e.fin)+'</div></td>'
        + '<td>'+esc(e.titre)+badgeAvance(e)+(dem?' <span class="badge warm">⚠ annulation</span>':'')+'<div class="meta">'+esc(e.lieu)+'</div>'+(e.statut==="Clôturé par défaut" && e.justificationCloture && peutGerer(e) ? '<div class="meta">⚠ '+esc(e.justificationCloture.slice(0,90))+(e.justificationCloture.length>90?'…':'')+'</div>' : '')+'</td>'
        + '<td>'+esc(e.categorie||"")+'</td>'
        + '<td>'+esc(organisateurDe(e)||"—")+(peutGerer(e)?'':' <span class="meta">(lecture)</span>')+'</td>'
        + '<td class="num"><span class="badge'+(placesRestantes(e)<=0?' low':'')+'">'+(illimite(e) ? placesPrises(e)+' (illimité)' : placesPrises(e)+' / '+e.placesTotal)+'</span></td>'
        + '<td class="num">'+att+'</td><td class="num">'+((e.tarif||0)>0?fmtEuro(e.tarif):'Gratuit')+'</td>'
        + '<td><span class="badge'+(statutAffiche(e)==="Ouvert"?' ok':(statutAffiche(e)==="Annulé"?' low':' warm'))+'">'+esc(statutAffiche(e))+'</span></td></tr>';
    }).join("");
    html = '<div class="toolbar"><h2>Évènements</h2><button class="btn btn-primary" data-action="open-evenement">+ Créer un évènement</button></div>'
      + (state.candidatures.length ? '<div class="alert">⚠ '+state.candidatures.length+' candidature(s) d\'adhérent à valider : onglet Adhérents.</div>' : '')
      + (demandes ? '<div class="alert">⚠ '+demandes+' demande(s) d\'annulation en attente : ouvrez l\'évènement concerné pour les traiter.</div>' : '')
      + bandeauFiltreTuile()
      + '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">'
      + '<div class="field" style="min-width:240px"><label for="ev-recherche">Recherche</label><input type="search" id="ev-recherche" value="'+esc(evenementsRecherche)+'" placeholder="Titre, lieu, catégorie…"></div>'
      + '<div class="field"><label for="ev-statut">Statut</label><select id="ev-statut"><option value="">Tous</option>'+listeStatuts().map(function(x){ return '<option'+(x===evenementsFiltreStatut?' selected':'')+'>'+esc(x)+'</option>'; }).join("")+'</select></div>'
      + '<label class="check field" style="flex-direction:row;align-items:center"><input type="checkbox" id="ev-miens" '+(evenementsMiens?'checked':'')+'> Seulement ceux que je gère</label>'
      + '<label class="check field" style="flex-direction:row;align-items:center"><input type="checkbox" id="ev-avenir" '+(evenementsAvenirSeulement?'checked':'')+'> À venir seulement</label></div>'
      + (liste.length ? '<div class="table-scroll"><table class="tbl"><thead><tr><th class="num">N°</th><th>Date</th><th>Évènement</th><th>Catégorie</th><th>Organisateur</th><th class="num">Inscrits / places</th><th class="num">Attente</th><th class="num">Tarif</th><th>Statut</th></tr></thead><tbody>'+lignes+'</tbody></table></div>'
        : '<div class="empty-state">Aucun évènement ne correspond.</div>');
    document.getElementById("panel-evenements").innerHTML = html;
  }

  // ---------- modale évènement ----------
  function renderModal(){
    var root = document.getElementById("modal-root");
    if(!modalOuverte){ root.innerHTML = ""; return; }
    var ev = modalEvenementId ? evenementById(modalEvenementId) : null;
    if(modalEvenementId && !ev && modalEvenementId === modalCreeId) return; // évènement tout juste créé : on attend son arrivée en direct
    if(modalEvenementId && !ev){ modalOuverte = false; modalEvenementId = null; root.innerHTML = ""; return; }
    var cats = state.categories.slice(); if(ev && ev.categorie && cats.indexOf(ev.categorie) < 0) cats.push(ev.categorie);
    if(ev && !peutGerer(ev)){
      root.innerHTML = '<div class="modal-backdrop" data-action="close-modal"><div class="modal-box">'
        + '<div class="modal-head"><h3>'+esc(ev.titre)+(ev.numero?" ("+numEv(ev)+")":"")+badgeAvance(ev)+'</h3><button type="button" class="modal-close" data-action="cancel-modal" aria-label="Fermer">✕</button></div>'
        + '<div class="modal-body"><div class="alert">Cette fiche est gérée par '+esc(organisateurDe(ev)||"son organisateur")+' : vous pouvez la consulter, mais pas la modifier.</div>'
        + '<div class="meta">'+fmtDate(ev.date)+' · '+esc(ev.debut)+'–'+esc(ev.fin)+'</div>'
        + '<div class="meta">'+esc(ev.lieu)+' · '+esc(ev.categorie||"")+' · '+esc(ev.statut)+'</div>'
        + '<div class="meta">'+((ev.tarif||0)>0 ? 'Tarif : '+fmtEuro(ev.tarif)+' par personne' : 'Gratuit')+'</div>'
        + (ev.description ? '<div class="meta">'+esc(ev.description)+'</div>' : '')
        + '<div id="inscrits-zone"></div>'
        + '<div class="form-actions"><button type="button" class="btn btn-ghost" data-action="cancel-modal">Fermer</button></div></div></div></div>';
      renderInscritsZone(); return;
    }
    var stSel = ev ? (modalStatutBrouillon || statutAffiche(ev)) : "Ouvert";
    var jSel = modalJustifBrouillon !== null ? modalJustifBrouillon : ((ev && ev.justificationCloture) || "");
    var pbCl = ev ? controleCloture(ev) : [];
    var closSel = stSel === "Clos" || stSel === "Clôturé par défaut";
    function sel(label,name,opts,val){ return '<div class="field"><label for="f-'+name+'">'+label+'</label><select id="f-'+name+'" name="'+name+'">'+opts.map(function(o){ return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'; }).join("")+'</select></div>'; }
    root.innerHTML = '<div class="modal-backdrop" data-action="close-modal"><div class="modal-box">'
      + '<div class="modal-head"><h3>'+(ev?"Modifier l'évènement"+(ev.numero?" "+numEv(ev):""):"Créer un évènement")+'<span id="badge-avance">'+badgeAvance(ev)+'</span></h3><button type="button" class="modal-close" data-action="cancel-modal" aria-label="Fermer">✕</button></div>'
      + '<div class="modal-body"><form id="form-evenement">'
      + (ev ? '<div class="meta" style="margin-bottom:10px">Organisateur : <strong>'+esc(organisateurDe(ev)||"—")+'</strong></div>' : '')
      + (ev && estAVerifier(ev) ? '<div class="alert">⚠ Évènement à vérifier : sa date est passée. Contrôlez les inscrits, les paiements et surtout les finances, puis passez le statut à « Clos ». S\'il reste des points à régler, la clôture sera enregistrée « Clôturé par défaut » avec votre justification et signalée au Directeur.</div>' : '')
      + (ev && ev.statut === "Clôturé par défaut" ? '<div class="alert">⚠ Clôturé par défaut'+(ev.clotureLe ? ' le '+fmtTs(ev.clotureLe) : '')+(ev.cloturePar ? ' par '+esc(ev.cloturePar) : '')+'. Justification : « '+esc(ev.justificationCloture||"—")+' ». Vous pouvez revenir sur cet évènement pour le rectifier (passez-le à « Clos » quand tout est réglé) ou le laisser tel quel.</div>' : '')
      + champ("Titre","titre","text",ev?ev.titre:"",true)
      + '<div class="field-row">'+sel("Catégorie","categorie",cats,ev?ev.categorie:cats[0])+sel("Statut","statut",(function(){ var l = listeStatuts(); if(l.indexOf(stSel) < 0) l.push(stSel); return l; })(),stSel)+'</div>'
      + '<div class="field-row">'+champ("Date","date","date",ev?ev.date:"",true)+champ("Lieu","lieu","text",ev?ev.lieu:"",true)+'</div>'
      + '<div class="field-row">'+champ("Début","debut","time",ev?ev.debut:"",true)+champ("Fin","fin","time",ev?ev.fin:"",true)
      + champ("Places","placesTotal","number",ev&&ev.placesTotal>0?ev.placesTotal:"",false,'min="1" placeholder="Illimité" ')+champ("Tarif par personne","tarif","number",ev?(ev.tarif||0):0,false,'min="0" step="0.01" ')
      + champ("Accompagnants autorisés par inscrit (0 = aucun)","accompagnantsMax","number",ev?accMax(ev):0,true,'min="0" max="10" ')+'</div>'
      + '<div class="field"><label for="f-description">Description (visible par tous)</label><textarea id="f-description" name="description" rows="2">'+esc(ev?ev.description:"")+'</textarea></div>'
      + (ev ? '<div id="justif-bloc" class="field" style="margin-bottom:10px"'+(closSel?'':' hidden')+'><div class="meta" style="margin-bottom:4px">Contrôle automatique avant clôture : <strong>'+(pbCl.length ? esc(pbCl.join(" ; ")) : "aucun point à régler")+'</strong></div>'
        + '<label for="f-justification">Justification de la clôture (obligatoire si des points restent à régler : l\'évènement est alors « Clôturé par défaut » et signalé au Directeur)</label>'
        + '<textarea id="f-justification" name="justification" rows="3" maxlength="1000">'+esc(jSel)+'</textarea></div>' : '')
      + '<label class="check" style="margin-bottom:10px"><input type="checkbox" name="gestionAvancee" '+(ev && ev.gestionAvancee===true?'checked':'')+'> Gestion avancée : finances de l\'évènement (frais engagés, budget, autres recettes, rappels, bilan imprimable)</label>'
      + (modalErreur ? '<div class="error-text" style="margin-bottom:8px">'+esc(modalErreur)+'</div>' : '')
      + '<div class="form-actions"><button type="submit" class="btn btn-primary" '+(authReady?"":"disabled")+'>💾 '+(ev?"Enregistrer":"Créer")+'</button>'
      + '<button type="button" class="btn btn-ghost" data-action="cancel-modal">Fermer</button>'
      + (ev && role==="directeur" ? '<button type="button" class="btn-danger-ghost" data-action="delete-evenement" data-id="'+ev.id+'">Supprimer l\'évènement</button>' : '')
      + '</div></form>'
      + (ev ? '<div id="inscrits-zone"></div>' : '') + '<div id="finances-bloc"'+(ev && ev.gestionAvancee===true ? '' : ' hidden')+'><div id="finances-zone"></div>' + formulaireFrais() + '</div></div></div></div>';
    renderInscritsZone(); renderFinancesZone();
  }

  // Formulaire d'ajout d'un frais ou d'une recette ; devient « Modifier » quand fraisEnEdition désigne une ligne (enregistrée ou du brouillon).
  function fraisAModifier(){
    if(!fraisEnEdition) return null;
    var src = modalEvenementId ? state.frais : brouillon.frais;
    return src.find(function(f){ return f.id === fraisEnEdition; }) || null;
  }
  function formFraisHtml(){
    var d = new Date(), p2 = function(n){ return String(n).padStart(2,"0"); };
    var auj = d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
    var f = fraisAModifier(), edit = !!f;
    f = f || {};
    function opt(v, lib, cur){ return '<option value="'+v+'"'+(cur===v?' selected':'')+'>'+lib+'</option>'; }
    return '<form id="form-frais" class="form" style="margin-top:10px"><div class="section-title">'+(edit ? "Modifier le frais ou la recette" : "Ajouter un frais ou une recette")+'</div><div class="field-row">'
      + '<div class="field"><label for="fr-sens">Type</label><select id="fr-sens" name="sens">'+opt("depense","Frais engagé",f.sens==="recette"?"recette":"depense")+opt("recette","Autre recette",f.sens==="recette"?"recette":"depense")+'</select></div>'
      + champ("Date","date","date",f.date||auj,true) + champ("Libellé","libelle","text",f.libelle||"",true) + champ("Fournisseur / origine (facultatif)","fournisseur","text",f.fournisseur||"",false)
      + '<div class="field"><label for="fr-cat">Catégorie</label><input id="fr-cat" name="categorie" list="fr-cats" placeholder="Choisir ou écrire"'+(f.categorie?' value="'+esc(f.categorie)+'"':'')+'><datalist id="fr-cats">'
      + FRAIS_CATEGORIES.concat(["Subvention","Sponsor / don","Buvette","Vente"]).map(function(c){ return '<option value="'+esc(c)+'">'; }).join("")+'</datalist></div>'
      + champ("Montant (€)","montant","number",typeof f.montant === "number" ? f.montant : "",true,'min="0.01" step="0.01" ')
      + '<div class="field"><label for="fr-st">État</label><select id="fr-st" name="statut">'+opt("a_payer","À payer / attendue",f.statut==="paye"?"paye":"a_payer")+opt("paye","Payé / reçue",f.statut==="paye"?"paye":"a_payer")+'</select></div>'
      + champ("N° de facture (facultatif)","reference","text",f.reference||"",false) + champ("Lien du justificatif (facultatif, https://…)","lien","url",f.lien||"",false)
      + '</div>' + (fraisErreur ? '<div class="error-text">'+esc(fraisErreur)+'</div>' : '')
      + '<div class="form-hint">Le justificatif n\'est pas stocké dans l\'appli : colle ici le lien d\'un fichier rangé ailleurs (Drive…).</div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary btn-sm">'+(edit ? "💾 Enregistrer la modification" : "Ajouter")+'</button>'
      + (edit ? '<button type="button" class="btn btn-ghost btn-sm" data-action="annuler-modif-frais">Annuler la modification</button>' : '')+'</div></form>';
  }
  // Remplace uniquement le formulaire des frais : ce qui est en cours de saisie dans le reste de la fenêtre n'est pas touché.
  function renderFormFrais(montrer){
    var el = document.getElementById("form-frais");
    if(!el) return;
    el.outerHTML = formFraisHtml();
    var n = document.getElementById("form-frais");
    if(montrer && n && n.scrollIntoView) n.scrollIntoView({block:"center"});
  }

  function formulaireFrais(){
    var d = new Date(), p2 = function(n){ return String(n).padStart(2,"0"); };
    var auj = d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
    var ev = modalEvenementId ? evenementById(modalEvenementId) : null, fiche = ev ? ficheDe(ev.id) : null;
    var budgetVal = ev ? (fiche && typeof fiche.budget === "number" ? fiche.budget : "") : (brouillon.budget === null ? "" : brouillon.budget);
    return '<form id="form-budget" class="form" style="margin-top:10px"><div class="section-title">Budget prévu</div><div class="field-row">'
      + champ("Budget prévu pour l\'évènement (€, vide = aucun)","budget","number",budgetVal,false,'min="0" step="0.01" ')
      + '</div><div class="form-actions"><button type="submit" class="btn btn-ghost btn-sm">Enregistrer le budget</button></div></form>'
      + formFraisHtml()
      + '<form id="form-rappel" class="form" style="margin-top:10px"><div class="section-title">Ajouter un rappel</div><div class="field-row">'
      + champ("Rappel (assurance, autorisation, matériel…)","texte","text","",true)
      + '</div><div class="form-actions"><button type="submit" class="btn btn-ghost btn-sm">Ajouter le rappel</button>'
      + '<button type="button" class="btn btn-ghost btn-sm" data-action="rappels-types">Ajouter les rappels types</button></div></form>';
  }

  // Zone des inscrits : re-rendue seule, pour ne jamais effacer ce qui est en cours de saisie dans le formulaire.
  function renderInscritsZone(){
    var zone = document.getElementById("inscrits-zone");
    if(!zone || !modalEvenementId) return;
    var ev = evenementById(modalEvenementId);
    if(!ev){ return; }
    var ins = inscriptionsDe(ev.id).slice().sort(function(a,b){
      if(a.statut !== b.statut) return a.statut === "inscrit" ? -1 : 1;
      return nomAdherent(adherentById(a.adherentId)).localeCompare(nomAdherent(adherentById(b.adherentId)), "fr");
    });
    var restantes = placesRestantes(ev);
    var gere = peutGerer(ev);
    var rows = ins.map(function(i){
      var a = adherentById(i.adherentId);
      var tarif = (ev.tarif||0) > 0;
      var ep = etatPaiement(ev, i), paye = ep.du > 0 && ep.reste <= 0;
      return '<div class="inscrit-row"><div><strong>'+esc(nomAdherent(a))+'</strong> '
        + (i.nbAccompagnants ? '<span class="meta">+ '+i.nbAccompagnants+' accompagnant(s) : '+texteAcc(i)+'</span> ' : '')
        + (i.statut==="attente" ? '<span class="badge warm">Liste d\'attente</span> ' : '')
        + (i.demandeAnnulation ? '<span class="badge low">⚠ Annulation demandée</span> ' : '')
        + (tarif && i.statut==="inscrit" ? '<span class="meta">· '+fmtEuro(ep.du)+(ep.reste>0 ? ' (reste '+fmtEuro(ep.reste)+')' : (ep.reste<0 ? ' (à rembourser '+fmtEuro(-ep.reste)+')' : ''))+'</span>' : '') + '</div>'
        + '<div class="inscrit-actions">'
        + (gere ? (
          (i.statut==="inscrit" ? '<label class="check"><input type="checkbox" data-action="toggle-present" data-id="'+i.id+'" '+(i.present?'checked':'')+'> Présent</label>' : '')
          + (i.statut==="inscrit" && tarif ? '<label class="check"><input type="checkbox" data-action="toggle-paye" data-id="'+i.id+'" '+(paye?'checked':'')+'> Payé</label>' : '')
          + (i.statut==="attente" ? '<button type="button" class="btn btn-sm" data-action="promouvoir" data-id="'+i.id+'">Passer en inscrit</button>' : '')
          + (i.demandeAnnulation ? '<button type="button" class="link-btn" data-action="ignorer-annulation" data-id="'+i.id+'">Ignorer</button>' : '')
          + (i.statut==="inscrit" && tarif ? '<button type="button" class="btn btn-ghost btn-sm" data-action="ouvrir-compte" data-id="'+i.adherentId+'" data-ev="'+ev.id+'">💶 Versement</button>' : '')
          + '<button type="button" class="btn-danger-ghost" data-action="retirer" data-id="'+i.id+'">Retirer</button>'
        ) : (
          (i.statut==="inscrit" && i.present ? '<span class="badge ok">Présent</span>' : '')
          + (i.statut==="inscrit" && tarif ? (paye ? '<span class="badge ok">Payé</span>' : '<span class="badge warm">Non payé</span>') : '')
        )) + '</div></div>';
    }).join("");
    var dispo = state.adherents.filter(function(a){ return a.actif && !ins.some(function(i){ return i.adherentId === a.id; }); })
      .sort(function(a,b){ return nomAdherent(a).localeCompare(nomAdherent(b),"fr"); });
    var ajout = !gere ? '' : dispo.length
      ? '<div class="form-actions" style="margin-top:12px"><select id="sel-adherent">'+dispo.map(function(a){ return '<option value="'+a.id+'">'+esc(a.nom+" "+a.prenom)+'</option>'; }).join("")+'</select>'
        + (accMax(ev) > 0 ? '<textarea id="sel-acc" rows="2" placeholder="Accompagnants (un nom par ligne, max '+accMax(ev)+')" style="min-width:220px"></textarea>' : '')
        + '<button type="button" class="btn btn-sm" data-action="inscrire-adherent" data-id="'+ev.id+'">Inscrire</button></div>'
      : '<div class="meta" style="margin-top:12px">Tous les adhérents actifs sont déjà inscrits.</div>';
    zone.innerHTML = '<div class="section-title">👥 Inscrits — '+(illimite(ev) ? placesPrises(ev)+' personne(s), places illimitées' : placesPrises(ev)+' / '+ev.placesTotal+' places ('+(restantes<=0?'complet':restantes+' libre(s)')+')')+'</div>'
      + (rows || '<div class="meta">Personne d\'inscrit pour le moment.</div>') + ajout;
  }

  function classeMontant(x){ return x < 0 ? "solde-pos" : (x > 0 ? "solde-neg" : ""); }
  function renderFinancesZone(){
    var zone = document.getElementById("finances-zone");
    if(!zone) return;
    if(!modalEvenementId){
      var dep = 0, rec = 0;
      brouillon.frais.forEach(function(f){ if(f.sens === "recette") rec += f.montant; else dep += f.montant; });
      zone.innerHTML = '<div class="section-title" style="margin-top:14px">💶 Finances de l\'évènement (brouillon, enregistré avec « Créer »)</div>'
        + '<div class="meta">Budget prévu : <strong>'+(brouillon.budget===null?"—":fmtEuro(brouillon.budget))+'</strong> · Frais engagés : <strong>'+fmtEuro(dep)+'</strong> · Autres recettes : <strong>'+fmtEuro(rec)+'</strong></div>'
        + (brouillon.frais.length ? '<div class="table-scroll"><table class="tbl"><thead><tr><th>Date</th><th>Libellé</th><th>Type</th><th class="num">Montant</th><th></th></tr></thead><tbody>'
            + brouillon.frais.map(function(f){ return '<tr><td>'+fmtDateCourt(f.date)+'</td><td>'+esc(f.libelle)+(f.fournisseur?'<div class="meta">'+esc(f.fournisseur)+'</div>':'')+'</td><td>'+(f.sens==="recette"?"Recette":"Frais")+' · '+(f.statut==="paye"?"payé/reçu":"à payer/attendu")+'</td><td class="num">'+fmtEuro(f.montant)+'</td>'
              + '<td style="white-space:nowrap"><button type="button" class="btn btn-ghost btn-sm" data-action="modifier-frais" data-id="'+f.id+'">✏ Modifier</button> <button type="button" class="btn-danger-ghost" data-action="supprimer-brouillon-frais" data-id="'+f.id+'">Retirer</button></td></tr>'; }).join("")
            + '</tbody></table></div>' : '<div class="meta">Aucun frais saisi pour le moment.</div>')
        + (brouillon.rappels.length ? '<div class="section-title" style="margin-top:10px">🔔 Rappels</div>' + brouillon.rappels.map(function(r){ return '<div class="meta">• '+esc(r.texte)+' <button type="button" class="link-btn" data-action="supprimer-brouillon-rappel" data-id="'+r.id+'">Retirer</button></div>'; }).join("") : '');
      return;
    }
    var ev = evenementById(modalEvenementId);
    if(!ev || !peutGerer(ev) || !modeAvance(ev)){ zone.innerHTML = ""; return; }
    var b = bilanEvenement(ev);

    function table(liste, recette){

      return '<div class="table-scroll"><table class="tbl"><thead><tr><th>Date</th><th>'+(recette?"Recette":"Frais")+'</th><th>Catégorie</th><th class="num">Montant</th><th></th><th></th></tr></thead><tbody>'
        + liste.map(function(f){

            + '<td><label class="check"><input type="checkbox" data-action="toggle-frais-paye" data-id="'+f.id+'" '+(f.statut==="paye"?'checked':'')+'> '+(recette?"Reçue":"Payé")+'</label></td>'

      return '<div class="inscrit-row"><label class="check"><input type="checkbox" data-action="toggle-rappel" data-id="'+esc(r.id)+'" '+(r.fait?'checked':'')+'> <span'+(r.fait?' style="text-decoration:line-through;color:var(--ink-faint)"':'')+'>'+esc(r.texte)+'</span></label>'

      : '<div class="meta">Aucun rappel.</div>';
    zone.innerHTML = '<div class="section-title" style="margin-top:22px">💶 Finances de l\'évènement</div>'

      + tuile("Frais engagés", fmtEuro(b.engage)) + tuile("dont payés", fmtEuro(b.fraisPayes)) + tuile("reste à payer", fmtEuro(b.fraisAPayer))
      + (b.budget !== null ? tuile("Budget prévu", fmtEuro(b.budget)) + tuile(b.ecartBudget < 0 ? "Dépassement du budget" : "Reste sur le budget", fmtEuro(Math.abs(b.ecartBudget)), b.ecartBudget<0?"solde-pos":"solde-neg") : '')
      + tuile("Encaissé des inscrits", fmtEuro(b.regle)) + tuile("Reste à encaisser", fmtEuro(b.resteEncaisser))
      + ((b.recettesRecues||b.recettesAttendues) ? tuile("Autres recettes reçues", fmtEuro(b.recettesRecues)) + tuile("Autres recettes attendues", fmtEuro(b.recettesAttendues)) : '')
      + tuile("Résultat actuel", fmtEuro(b.resultat), b.resultat<0?"solde-pos":"solde-neg") + tuile("Résultat si tout encaissé", fmtEuro(b.previsionnel), b.previsionnel<0?"solde-pos":"solde-neg")
      + tuile("Coût par personne", fmtEuro(b.coutParPersonne))
      + '</div>'
      + '<div class="section-title">Frais engagés (par date)</div>' + table(b.frais, false)
      + '<div class="section-title" style="margin-top:14px">Autres recettes (subvention, buvette, sponsor…)</div>' + table(b.recettes, true)
      + '<div class="section-title" style="margin-top:14px">🔔 Rappels'+(aFaire?' — '+aFaire+' à faire':'')+'</div>' + rappels
      + '<div class="form-actions" style="margin-top:8px"><button type="button" class="btn btn-ghost btn-sm" data-action="imprimer-bilan" data-id="'+ev.id+'">🖨 Imprimer / PDF le bilan</button></div>';
  }

      + '<div>Édité le '+d.toLocaleDateString("fr-FR")+' à '+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+'</div>'

      + (b.budget !== null ? '<tr><td>Budget prévu</td><td class="num">'+fmtEuro(b.budget)+'</td><td>'+(b.ecartBudget<0?'dépassement de '+fmtEuro(-b.ecartBudget):'reste sur le budget : '+fmtEuro(b.ecartBudget))+'</td></tr>' : '')
      + ((b.recettesRecues||b.recettesAttendues) ? '<tr><td>Autres recettes</td><td class="num">'+fmtEuro(b.recettesRecues)+'</td><td>reçues · attendues '+fmtEuro(b.recettesAttendues)+'</td></tr>' : '')
      + '<tr><td>Dû par les inscrits</td><td class="num">'+fmtEuro(b.du)+'</td><td>'+b.personnes+' personne(s) inscrite(s)</td></tr>'
      + '<tr><td>Encaissé des inscrits</td><td class="num">'+fmtEuro(b.regle)+'</td><td>reste à encaisser '+fmtEuro(b.resteEncaisser)+'</td></tr>'

      + '<tr><td>Résultat si tout est encaissé</td><td class="num">'+fmtEuro(b.previsionnel)+'</td><td>coût par personne : '+fmtEuro(b.coutParPersonne)+'</td></tr></tbody></table>'
      + '<h2>Frais engagés (par date)</h2>' + (fr ? '<table><thead><tr><th>Date</th><th>Frais</th><th>Catégorie</th><th class="num">Montant</th><th>État</th></tr></thead><tbody>'+fr+'</tbody></table>' : '<div>Aucun frais saisi.</div>')
      + (rc ? '<h2>Autres recettes</h2><table><thead><tr><th>Date</th><th>Recette</th><th>Catégorie</th><th class="num">Montant</th><th>État</th></tr></thead><tbody>'+rc+'</tbody></table>' : '')

            + '<td class="num">'+(actif ? (ep.reste>0 ? '<span class="solde-pos">'+fmtEuro(ep.reste)+'</span>' : (ep.reste<0 ? '<span class="solde-neg">'+fmtEuro(ep.reste)+'</span>' : '<span class="badge ok">Soldé</span>')) : '—')+'</td>' : '')

        + (tarif ? ' · À encaisser : <strong>'+fmtEuro(totDu)+'</strong> · Reçu : <strong>'+fmtEuro(totRegle)+'</strong> · Reste : <strong class="'+(totReste>0?'solde-pos':'')+'">'+fmtEuro(totReste)+'</strong>' : ' · Gratuit')+'</div>'

  // ---------- compte d'un adhérent ----------
  function fmtTs(ts){ try{ return ts.toDate().toLocaleString("fr-FR"); }catch(e){ return "…"; } }
  function renderCompte(){
    var root = document.getElementById("compte-root");
    if(!compteAdherentId){ root.innerHTML = ""; return; }
    var a = adherentById(compteAdherentId);
    if(!a && role !== "public"){ compteAdherentId = null; root.innerHTML = ""; return; }
    var gestion = role !== "public";
    var evPossibles = [];
    if(gestion){
      var vus = {};
      var ids = state.mouvements.filter(function(m){ return m.adherentId === compteAdherentId; }).map(function(m){ return m.evenementId; })
        .concat(state.inscriptions.filter(function(i){ return i.adherentId === compteAdherentId; }).map(function(i){ return i.evenementId; }));
      ids.forEach(function(eid){
        var ev = evenementById(eid);
        if(ev && peutGerer(ev) && !vus[ev.id]){ vus[ev.id] = 1; evPossibles.push(ev); }
      });
    }
    var form = (gestion && evPossibles.length)
      ? '<form id="form-reglement" class="form" style="margin-top:14px"><div class="section-title">Noter un versement (même partiel) ou un remboursement</div><div class="field-row">'
        + '<div class="field"><label for="rg-ev">Évènement</label><select id="rg-ev" name="ev">'+evPossibles.map(function(ev){ return '<option value="'+ev.id+'"'+(ev.id===compteEvenementId?' selected':'')+'>'+esc((ev.numero?numEv(ev)+" — ":"")+ev.titre)+'</option>'; }).join("")+'</select></div>'
        + '<div class="field"><label for="rg-type">Opération</label><select id="rg-type" name="type"><option value="paiement">Règlement reçu</option><option value="remboursement">Remboursement effectué</option></select></div>'
        + '<div class="field"><label for="rg-montant">Montant (€)</label><input id="rg-montant" name="montant" type="number" min="0.01" step="0.01" required></div>'
        + '</div>' + (compteErreur ? '<div class="error-text">'+esc(compteErreur)+'</div>' : '')
        + '<div class="form-actions"><button type="submit" class="btn btn-primary btn-sm">Enregistrer</button></div></form>'
      : '';
    root.innerHTML = '<div class="modal-backdrop" data-action="close-compte"><div class="modal-box">'
      + '<div class="modal-head"><h3>Compte de '+esc(a ? nomAdherent(a) : "l'adhérent")+'</h3><button type="button" class="modal-close" data-action="fermer-compte" aria-label="Fermer">✕</button></div>'
      + '<div class="modal-body"><div id="compte-zone"></div>' + form
      + '<div class="form-actions"><button type="button" class="btn btn-ghost" data-action="fermer-compte">Fermer</button></div></div></div></div>';
    renderCompteZone();

  // Tableau des mouvements : re-rendu seul pour ne pas effacer la saisie du formulaire de règlement.
  function renderCompteZone(){
    var zone = document.getElementById("compte-zone");
    if(!zone || !compteAdherentId) return;
    var ms = state.mouvements.filter(function(m){ return m.adherentId === compteAdherentId; })
      .sort(function(x,y){ return msDate(x) - msDate(y); });
    var cumul = 0;
    // Le solde cumulé se calcule du plus ancien au plus récent, puis la liste s'affiche du plus récent au plus ancien.
    var lignes = ms.map(function(m){
      cumul = Math.round((cumul + (m.montant||0))*100)/100;
      return '<tr><td>'+esc(fmtTs(m.date))+'</td><td class="num">'+(m.evenementNumero||"—")+'</td><td>'+esc(m.evenementTitre||"")+'</td><td>'+esc(m.libelle||m.type)+'</td>'
        + '<td class="num">'+(m.personnes ? (m.personnes>0?"+":"")+m.personnes : "")+'</td>'
        + '<td class="num">'+(m.montant ? (m.montant>0?"+":"")+fmtEuro(m.montant) : "—")+'</td><td class="num">'+fmtEuro(cumul)+'</td></tr>';
    }).reverse().join("");
    var solde = soldeAdherent(compteAdherentId);
    var parEv = {}, ordreEv = [];
    state.mouvements.filter(function(m){ return m.adherentId === compteAdherentId; }).forEach(function(m){

  // Remet les dates exportées ({__ts: ms} ou {seconds, nanoseconds}) sous forme de dates Firestore.
  function restaurerDates(x){
    if(Array.isArray(x)) return x.map(restaurerDates);
    if(x && typeof x === "object"){
      if(typeof x.__ts === "number") return Timestamp.fromMillis(x.__ts);
      if(typeof x.seconds === "number" && typeof x.nanoseconds === "number") return new Timestamp(x.seconds, x.nanoseconds);
      var o = {}; Object.keys(x).forEach(function(k){ o[k] = restaurerDates(x[k]); }); return o;
    }
    return x;
  }
  function importerDonnees(data){
    var lot1 = [], lot2 = [];
    function copieSansId(o){ var c = restaurerDates(Object.assign({}, o)); delete c.id; return c; }
    var nbCat = 0;
    if(Array.isArray(data.categories) && data.categories.length){
      var fusion = state.categories.concat(data.categories).filter(function(c,i,arr){ return c && arr.indexOf(c) === i; });
      nbCat = fusion.length - state.categories.length;
      if(nbCat > 0) lot1.push(setDoc(doc(db,"parametres","config"), {categories: fusion}, {merge:true}));
    }
    if(Array.isArray(data.statuts) && data.statuts.length){
      var fusionS = state.statutsPerso.concat(data.statuts).filter(function(x,i,arr){ return x && STATUTS_BASE.indexOf(x) < 0 && arr.indexOf(x) === i; });
      if(fusionS.length > state.statutsPerso.length) lot1.push(setDoc(doc(db,"parametres","config"), {statuts: fusionS}, {merge:true}));
    }
    (data.adherents||[]).forEach(function(o){ if(o && o.id) lot1.push(setDoc(doc(db,"adherents",o.id), copieSansId(o))); });
    (data.evenements||[]).forEach(function(o){ if(o && o.id) lot1.push(setDoc(doc(db,"evenements",o.id), copieSansId(o))); });
    // Les inscriptions, frais, fiches et mouvements viennent APRÈS les évènements : les règles de sécurité vérifient que l'évènement existe.
    var dejaMvt = {}; state.mouvements.forEach(function(m){ dejaMvt[m.id] = true; });
    var nbMvt = 0;
    Promise.all(lot1).then(function(){
      (data.inscriptions||[]).forEach(function(o){ if(o && o.id) lot2.push(setDoc(doc(db,"inscriptions",o.id), copieSansId(o))); });
      (data.frais||[]).forEach(function(o){ if(o && o.id) lot2.push(setDoc(doc(db,"frais",o.id), copieSansId(o))); });
      (data.fiches||[]).forEach(function(o){ if(o && o.id) lot2.push(setDoc(doc(db,"fiches",o.id), copieSansId(o))); });
      (data.mouvements||[]).forEach(function(o){ if(o && o.id && !dejaMvt[o.id]){ nbMvt++; lot2.push(setDoc(doc(db,"mouvements",o.id), copieSansId(o))); } });
      return Promise.all(lot2);
    }).then(function(){
      importStatus = "Import terminé : "+(data.adherents||[]).length+" adhérent(s), "+(data.evenements||[]).length+" évènement(s), "+(data.inscriptions||[]).length+" inscription(s), "
        +(data.frais||[]).length+" frais, "+(data.fiches||[]).length+" fiche(s) financière(s), "+nbMvt+" ligne(s) de compte ajoutée(s)"+(nbCat>0 ? ", "+nbCat+" catégorie(s) ajoutée(s)" : "")+".";
      importError = false; logHistorique("import_donnees", importStatus); renderDonnees();
    }).catch(function(err){
      importStatus = "Erreur pendant l'import : "+(err && err.message ? err.message : err); importError = true; renderDonnees();
    });
  }

  // Réinitialisation complète (Directeur) : confirmation par saisie du mot SUPPRIMER.
  // L'historique et le registre des comptes sont traités à part (« au mieux ») : les règles peuvent les protéger contre la suppression,
  // ce qui ne doit pas faire échouer le reste.
  function reinitialiserApplication(){
    if(role !== "directeur") return;
    var saisie = prompt("Ceci va supprimer DÉFINITIVEMENT tous les adhérents, évènements, inscriptions, comptes, frais, fiches financières et candidatures. "
      + "Les comptes Gestionnaire/Directeur et les catégories sont conservés. L'historique et le registre des comptes sont aussi vidés si les règles de sécurité l'autorisent.\n\n"
      + "Pensez à exporter une copie avant (bouton « Exporter horodaté »).\n\nPour confirmer, tapez SUPPRIMER (en majuscules) :");
    if(saisie === null) return;
    if(saisie.trim() !== "SUPPRIMER"){ reinitialisationStatus = "Réinitialisation annulée : le texte tapé ne correspondait pas à « SUPPRIMER »."; reinitialisationError = true; renderDonnees(); return; }
    var nb = { adherents: state.adherents.length, evenements: state.evenements.length, inscriptions: state.inscriptions.length, frais: state.frais.length, fiches: state.fiches.length,
      candidatures: state.candidatures.length, mouvements: state.mouvements.length, historique: state.historique.length };
    var principales = [];
    [["inscriptions",state.inscriptions],["frais",state.frais],["fiches",state.fiches],["candidatures",state.candidatures],["adherents",state.adherents],["evenements",state.evenements]].forEach(function(c){
      c[1].forEach(function(o){ principales.push(deleteDoc(doc(db,c[0],o.id))); });
    });
    var okMvt = 0, okHist = 0;
    var auMieux = state.mouvements.map(function(o){ return deleteDoc(doc(db,"mouvements",o.id)).then(function(){ okMvt++; }).catch(function(){}); })
      .concat(state.historique.map(function(o){ return deleteDoc(doc(db,"historique",o.id)).then(function(){ okHist++; }).catch(function(){}); }));
    Promise.all(principales).then(function(){ return Promise.all(auMieux); }).then(function(){
      var msg = "Application réinitialisée : "+nb.adherents+" adhérent(s), "+nb.evenements+" évènement(s), "+nb.inscriptions+" inscription(s), "+nb.frais+" frais, "+nb.fiches+" fiche(s) financière(s) et "+nb.candidatures+" candidature(s) supprimés.";
      msg += (nb.mouvements === 0 ? " Aucune ligne de compte à supprimer." : okMvt === nb.mouvements ? " "+okMvt+" ligne(s) de compte supprimée(s)." : " Le registre des comptes ("+(nb.mouvements-okMvt)+" ligne(s)) n'a PAS pu être entièrement supprimé : les règles de sécurité Firestore ne l'autorisent pas (republier le fichier firestore.rules).");
      msg += (nb.historique === 0 ? "" : okHist === nb.historique ? " "+okHist+" entrée(s) d'historique supprimée(s)." : " L'historique ("+(nb.historique-okHist)+" entrée(s)) n'a pas pu être entièrement supprimé : les règles de sécurité Firestore ne l'autorisent pas (probablement volontaire, pour garder un journal fiable).");
      reinitialisationStatus = msg; reinitialisationError = false; logHistorique("reinitialisation_application", msg); renderDonnees();
    }).catch(function(err){
      reinitialisationStatus = "Erreur pendant la réinitialisation : "+(err && err.message ? err.message : err)+" (une partie a peut-être déjà été supprimée)."; reinitialisationError = true; renderDonnees();
    });
  }

  document.addEventListener("click", function(e){

      var f = document.getElementById("form-login"); var em = f && f.email.value.trim();
      if(!em){ loginError = "Indiquez votre email d'abord."; renderAdminRow(); return; }
      sendPasswordResetEmail(auth, em).catch(function(){}).then(function(){ loginError = ""; loginInfo = "Email envoyé si ce compte existe."; renderAdminRow(); });
    }
    else if(a==="open-identite"){ identiteFormOpen = true; renderEvenements(); }
    else if(a==="cancel-identite"){ identiteFormOpen = false; identiteError = ""; renderEvenements(); }
